name: Build and run functional tests using ragger through reusable workflow

# This workflow will build the app and then run functional tests using the Ragger framework upon Speculos emulation.
# It calls a reusable workflow developed by Ledger's internal developer team to build the application and upload the
# resulting binaries.
# It then calls another reusable workflow to run the Ragger tests on the compiled application binary.
#
# The build part of this workflow is mandatory, this ensures that the app will be deployable in the Ledger App Store.
# While the test part of this workflow is optional, having functional testing on your application is mandatory and this workflow and
# tooling environment is meant to be easy to use and adapt after forking your application

on:
  workflow_dispatch:
    inputs:
      golden_run:
        type: choice
        required: true
        default: 'Raise an error (default)'
        description: CI behavior if the test snapshots are different than expected.
        options:
          - 'Raise an error (default)'
          - 'Open a PR'
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  # A called workflow cannot be granted more than its caller allows, so each job below grants the scopes its
  # reusable workflow declares (the top-level default stays read-only).
  build_application:
    name: Build application using the reusable workflow
    permissions:
      contents: read
      actions: write
      pull-requests: write
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@0404474b2a3828026b63bd29841025db8e57eb80  # v1
    with:
      upload_app_binaries_artifact: "app_tezos_binaries"

  tests_standalone:
    name: Run standalone ragger tests using the reusable workflow
    needs: build_application
    permissions:
      contents: write
      actions: write
      pull-requests: write
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@0404474b2a3828026b63bd29841025db8e57eb80  # v1
    with:
      download_app_binaries_artifact: "app_tezos_binaries"
      regenerate_snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}
      test_dir: "tests/standalone"

  tests_swap:
    name: Run swap tests using the reusable workflow
    needs: build_application
    permissions:
      contents: write
      actions: write
      pull-requests: write
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_swap_tests.yml@0404474b2a3828026b63bd29841025db8e57eb80  # v1
    with:
      download_app_binaries_artifact: "app_tezos_binaries"
      regenerate_snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}
    secrets:
      token: ${{ secrets.CI_BOT_TOKEN }}
