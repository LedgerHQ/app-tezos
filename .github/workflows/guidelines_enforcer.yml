name: Ensure compliance with Ledger guidelines

# This workflow is mandatory in all applications
# It calls a reusable workflow guidelines_enforcer developed by Ledger's internal developer team.
# The successful completion of the reusable workflow is a mandatory step for an app to be available on the Ledger
# application store.
#
# More information on the guidelines can be found in the repository:
# LedgerHQ/ledger-app-workflows/

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  guidelines_enforcer:
    name: Call Ledger guidelines_enforcer
    # A called workflow cannot be granted more than its caller allows; these are the scopes
    # reusable_guidelines_enforcer declares.
    permissions:
      contents: read
      actions: write
      pull-requests: write
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_guidelines_enforcer.yml@0404474b2a3828026b63bd29841025db8e57eb80  # v1
