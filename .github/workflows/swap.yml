name: Swap functional tests

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - develop
  pull_request:

permissions:
  contents: read

jobs:
  job_functional_tests:
    # A called workflow cannot be granted more than its caller allows. The nested reusable_build and
    # reusable_ragger_tests declare these scopes, so the job must grant them or the run fails at startup.
    permissions:
      contents: write
      actions: write
      pull-requests: write
    uses: LedgerHQ/app-exchange/.github/workflows/reusable_swap_functional_tests.yml@445797d4af46530daa4af104e4ce6d2c9af9204a  # develop
    with:
      branch_for_exchange: 'develop'
      branch_for_tezos: ${{ github.ref }}
      repo_for_tezos: ${{ github.repository }}
      test_filter: '"tezos"'
