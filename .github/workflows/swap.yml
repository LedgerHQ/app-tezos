name: Swap functional tests

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - develop
  pull_request:

jobs:
  job_functional_tests:
    uses: LedgerHQ/app-exchange-dev/.github/workflows/reusable_swap_functional_tests.yml@develop
    with:
      branch_for_tezos: ${{ github.ref }}
      test_filter: '"tezos"'
    secrets:
      token: ${{ secrets.CI_BOT_TOKEN }}
