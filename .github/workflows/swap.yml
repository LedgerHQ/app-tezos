name: Swap functional tests

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - develop
  pull_request:

permissions:
  contents: read

jobs:
  job_functional_tests:
    # A called workflow cannot be granted more than its caller allows. The nested reusable_build and
    # reusable_ragger_tests declare these scopes, so the job must grant them or the run fails at startup.
    permissions:
      contents: write
      actions: write
      pull-requests: write
    uses: LedgerHQ/app-exchange-dev/.github/workflows/reusable_swap_functional_tests.yml@140d73c2c91ea36502f694570ce262068223a3a8  # develop

    with:
      # Pinning the workflow file is not enough: this input defaults to the
      # mutable `develop`, and decides which Exchange sources are built and
      # run. Keep it on the same commit as the `uses:` line above.
      branch_for_exchange: 140d73c2c91ea36502f694570ce262068223a3a8
      branch_for_tezos: ${{ github.ref }}
      test_filter: '"tezos"'
    secrets:
      token: ${{ secrets.CI_BOT_TOKEN }}
