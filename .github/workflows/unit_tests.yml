name: Unit testing with Codecov coverage checking

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  job_unit_test:
    name: Call Ledger unit_test
    # A called workflow cannot be granted more than its caller allows; reusable_unit_tests declares
    # actions: write (for upload-artifact) and, in its coverage job, pull-requests: write (PR comment).
    permissions:
      contents: read
      actions: write
      pull-requests: write
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_unit_tests.yml@0404474b2a3828026b63bd29841025db8e57eb80  # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
